name: market-master

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &common-env
    KAFKA_BROKERS: kafka:29092
    JWT_SECRET: dev-jwt-secret-change-me
    PSP_WEBHOOK_SECRET: dev-psp-secret
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Explicit topic creation: partition count is a contract (see ADR-0002).
  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic market.orders.v1 --partitions 12 --replication-factor 1

  identity:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: identity}
    environment:
      <<: *common-env
      ADDR: ":8081"
      GRPC_ADDR: ":9081"
      DATABASE_URL: postgres://market:market@postgres:5432/identity?sslmode=disable
    ports: ["18081:8081", "9081:9081"]

  catalog:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: catalog}
    environment:
      <<: *common-env
      ADDR: ":8082"
      GRPC_ADDR: ":9082"
      DATABASE_URL: postgres://market:market@postgres:5432/catalog?sslmode=disable
    ports: ["18082:8082", "9082:9082"]

  order:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: order}
    environment:
      <<: *common-env
      ADDR: ":8083"
      GRPC_ADDR: ":9083"
      DATABASE_URL: postgres://market:market@postgres:5432/orders?sslmode=disable
      CATALOG_GRPC_ADDR: catalog:9082
    ports: ["8083:8083", "9083:9083"]

  payment:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: payment}
    environment:
      <<: *common-env
      ADDR: ":8084"
      DATABASE_URL: postgres://market:market@postgres:5432/payment?sslmode=disable
      ORDER_GRPC_ADDR: order:9083
    ports: ["8084:8084"]

  logistics:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: logistics}
    environment:
      <<: *common-env
      ADDR: ":8085"
      DATABASE_URL: postgres://market:market@postgres:5432/logistics?sslmode=disable
      ORDER_GRPC_ADDR: order:9083
    ports: ["18085:8085"]

  gateway:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: gateway}
    environment:
      <<: *common-env
      ADDR: ":8080"
      IDENTITY_GRPC_ADDR: identity:9081
      IDENTITY_HTTP_ADDR: identity:8081
      CATALOG_HTTP_ADDR: catalog:8082
      ORDER_HTTP_ADDR: order:8083
      PAYMENT_HTTP_ADDR: payment:8084
      LOGISTICS_HTTP_ADDR: logistics:8085
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      identity:
        condition: service_started
      catalog:
        condition: service_started
      order:
        condition: service_started
      payment:
        condition: service_started
      logistics:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ["8089:80"]
    depends_on:
      - gateway

volumes:
  pgdata:
