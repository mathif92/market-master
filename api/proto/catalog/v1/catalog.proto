syntax = "proto3";

package catalog.v1;

option go_package = "market-master/gen/catalog/v1;catalogv1";

// CatalogService lets the order service validate and snapshot line items
// against authoritative prices in one internal gRPC round-trip.
service CatalogService {
  rpc ValidateOrderLines(ValidateOrderLinesRequest) returns (ValidateOrderLinesResponse);
}

message ValidateOrderLinesRequest {
  string tenant_id = 1;
  repeated OrderLineInput lines = 2;
}

message OrderLineInput {
  string product_id = 1;
  int32 quantity = 2;
}

message ValidateOrderLinesResponse {
  bool valid = 1;
  string error_message = 2;
  repeated OrderLineSnapshot lines = 3;
}

message OrderLineSnapshot {
  string product_id = 1;
  string name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
  string currency = 5;
}
